---
name: Deploy staging

# Staging runs provider sandboxes: Chapa test keys and a Telegram test number. No live
# money and no live phone numbers, but it is a real AWS account.
#
# Required secrets: AWS_ROLE_ARN, PULUMI_ACCESS_TOKEN. Both are set on the `staging`
# environment, not at repository level, so a workflow outside that environment cannot
# reach them.

on:
  push:
    branches: [main]
    paths:
      - abro-api/**
      - abro-web/**
      - abro-infra/**
      - packages/**
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.abro.et
    permissions:
      contents: read
      id-token: write
    env:
      HAS_CREDENTIALS: ${{ secrets.AWS_ROLE_ARN != '' && secrets.PULUMI_ACCESS_TOKEN != '' }}
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Report missing credentials
        if: env.HAS_CREDENTIALS != 'true'
        run: |
          echo "::notice::Staging credentials are not configured yet, so nothing was" \
            "deployed. Set AWS_ROLE_ARN and PULUMI_ACCESS_TOKEN on the staging environment."

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        if: env.HAS_CREDENTIALS == 'true'
        with:
          python-version: '3.12'
          enable-cache: true

      - name: pulumi up
        if: env.HAS_CREDENTIALS == 'true'
        working-directory: abro-infra
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: |
          uv sync --all-extras --dev
          uv run pulumi up --stack staging --yes --non-interactive

      - name: Smoke test
        if: env.HAS_CREDENTIALS == 'true'
        run: curl --fail --silent --show-error https://staging.abro.et/healthz
