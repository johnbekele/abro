---
name: CI

# The always-on core: the six abro gates plus repo-wide static checks. Per-project
# suites live in ci-backend.yml, ci-web.yml and ci-mobile.yml, each filtered to its own
# directory so nothing fires for a project that does not exist yet.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  abro-gates:
    name: abro gates
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Run the six abro gates
        run: python scripts/gates/run_all.py

      - name: Prove the gates still fire
        run: |
          python -m pip install --quiet pytest==9.1.1
          python -m pytest scripts/gates/test_gates.py -q

      - name: ruff
        run: |
          python -m pip install --quiet ruff==0.16.1
          ruff check scripts
          ruff format --check scripts

  workflows:
    name: workflow and shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color

      - name: yamllint
        run: |
          pipx install yamllint==1.38.0
          yamllint --strict .

      - name: shellcheck
        run: git ls-files -z '*.sh' '*.bash' | xargs -0 -r shellcheck

  markdown:
    name: markdown
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: markdownlint
        run: npx --yes markdownlint-cli2@0.23.2 "**/*.md" "!**/node_modules/**"
