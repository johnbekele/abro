---
name: Infra

# Static analysis needs no credentials and always runs. `pulumi preview` needs
# PULUMI_ACCESS_TOKEN plus AWS_ROLE_ARN and is skipped, loudly, until they exist.

on:
  pull_request:
    paths:
      - abro-infra/**
      - '**/Dockerfile'
      - docker-compose.yml
      - .github/workflows/infra.yml
  push:
    branches: [main]
    paths:
      - abro-infra/**
      - '**/Dockerfile'
      - docker-compose.yml
      - .github/workflows/infra.yml
  workflow_dispatch:

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: checkov and hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: checkov
        if: hashFiles('abro-infra/**') != ''
        run: |
          python -m pip install --quiet checkov==3.3.8
          checkov --directory abro-infra --quiet --compact

      - name: hadolint
        run: |
          git ls-files -z '*Dockerfile*' | while IFS= read -r -d '' file; do
            echo "hadolint $file"
            docker run --rm -i ghcr.io/hadolint/hadolint:v2.12.0 < "$file"
          done

  preview:
    name: pulumi preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      id-token: write
    env:
      HAS_CREDENTIALS: ${{ secrets.PULUMI_ACCESS_TOKEN != '' && secrets.AWS_ROLE_ARN != '' }}
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Report missing credentials
        if: env.HAS_CREDENTIALS != 'true'
        run: |
          echo "::notice::PULUMI_ACCESS_TOKEN or AWS_ROLE_ARN is unset, so no plan was" \
            "produced. Both are repository secrets; see docs/RUNBOOK.md."

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        if: env.HAS_CREDENTIALS == 'true'
        with:
          python-version: '3.12'
          enable-cache: true

      - name: pulumi preview
        if: env.HAS_CREDENTIALS == 'true'
        working-directory: abro-infra
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: |
          uv sync --all-extras --dev
          uv run pulumi preview --stack staging --diff --non-interactive
